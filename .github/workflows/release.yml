name: Build and release

on:
  push:
    tags:
      - "v.0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows application
        shell: pwsh
        run: |
          $packageDir = "dist/ExifTool-${{ github.ref_name }}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/exif-tool.exe" "$packageDir/ExifTool.exe"
          Copy-Item "README.md" "$packageDir/README.md"
          Compress-Archive `
            -Path "$packageDir/*" `
            -DestinationPath "dist/ExifTool-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/ExifTool-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.display_name }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            display_name: Apple Silicon
          - target: x86_64-apple-darwin
            display_name: Intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build macOS application
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Create application bundle
        run: |
          app_dir="dist/ExifTool.app"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"

          cp "target/${{ matrix.target }}/release/exif-tool" \
            "$app_dir/Contents/MacOS/ExifTool"
          chmod +x "$app_dir/Contents/MacOS/ExifTool"
          cp packaging/macos/Info.plist "$app_dir/Contents/Info.plist"
          cp packaging/macos/exiftool.icns "$app_dir/Contents/Resources/exiftool.icns"
          cp README.md "$app_dir/Contents/Resources/README.md"

          file "$app_dir/Contents/MacOS/ExifTool"
          plutil -lint "$app_dir/Contents/Info.plist"

      - name: Ad-hoc sign application
        run: |
          codesign --force --deep --sign - dist/ExifTool.app
          codesign --verify --deep --strict --verbose=2 dist/ExifTool.app

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "ExifTool" \
            -srcfolder dist/ExifTool.app \
            -ov \
            -format UDZO \
            "dist/ExifTool-${{ github.ref_name }}-${{ matrix.target }}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-package
          path: dist/ExifTool-${{ github.ref_name }}-${{ matrix.target }}.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: ExifTool ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
